<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Free English learning games by Полякова Ольга">
  <title>Полякова Ольга — English Learning Games</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: #faf9f6; color: #26332e; font-family: Arial, sans-serif; }
    main { width: min(100% - 40px, 800px); margin: auto; padding: 100px 0; }
    .author { margin: 0 0 18px; font-size: 20px; }
    h1 { margin: 0 0 24px; font-size: clamp(36px, 7vw, 64px); line-height: 1.1; letter-spacing: -1px; }
    .subtitle { margin: 0; color: #58665f; font-size: 20px; line-height: 1.6; }
    section { margin-top: 48px; padding-top: 24px; border-top: 1px solid #e2e5df; }
    h2 { margin: 0 0 12px; font-size: 28px; }
    section p { margin: 0; color: #58665f; line-height: 1.6; }
    footer { padding: 24px 20px; text-align: center; color: #58665f; font-size: 14px; border-top: 1px solid #e2e5df; }
    .games-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 20px; margin-top: 24px; }
    .game-card { padding: 24px; border: 1px solid #dce2dc; border-radius: 12px; background: #fff; }
    h3 { margin: 0 0 8px; font-size: 22px; }
    .game-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; }
    .game-actions a, .game-actions button { border: 1px solid #385749; border-radius: 7px; padding: 10px 16px; font: inherit; cursor: pointer; text-decoration: none; }
    .game-actions a { background: #385749; color: #fff; }
    .game-actions button { background: #fff; color: #385749; }
    .game-actions a:hover, .game-actions button:hover { filter: brightness(.92); }
    .game-actions :focus-visible { outline: 3px solid #b2792c; outline-offset: 3px; }
    #copy-status { min-height: 1.6em; margin-top: 16px; }
  </style>
</head>
<body>
  <main>
    <p class="author" lang="ru">Полякова Ольга</p>
    <h1>English Learning Games</h1>
    <p class="subtitle">Free interactive games for learning English</p>
    <section aria-labelledby="reading-heading">
      <h2 id="reading-heading">Reading</h2>
      <div class="games-grid">
        <article class="game-card">
          <h3>Short E /e/</h3>
          <p>Butterfly Garden</p>
          <div class="game-actions">
            <a href="./reading/short-e-butterflies/">Open game</a>
            <button type="button" data-path="reading/short-e-butterflies/">Copy link</button>
          </div>
        </article>
        <article class="game-card">
          <h3>Short I /ɪ/</h3>
          <p>Firefly Catch</p>
          <div class="game-actions">
            <a href="./reading/short-i-fireflies/">Open game</a>
            <button type="button" data-path="reading/short-i-fireflies/">Copy link</button>
          </div>
        </article>
      </div>
      <p id="copy-status" role="status" aria-live="polite"></p>
    </section>
    <section aria-labelledby="grammar-heading">
      <h2 id="grammar-heading">Grammar</h2>
      <p>More games coming soon</p>
    </section>
  </main>
  <footer>Created by <span lang="ru">Полякова Ольга</span></footer>
  <script>
    const publicBase = 'https://olga27-creator.github.io/Polyakova-open-games/';
    document.querySelectorAll('button[data-path]').forEach(button => {
      button.addEventListener('click', async () => {
        const url = new URL(button.dataset.path, publicBase).href;
        const status = document.getElementById('copy-status');
        try {
          await navigator.clipboard.writeText(url);
          status.textContent = 'Link copied!';
        } catch {
          status.textContent = 'Copy this link: ' + url;
        }
      });
    });
  </script>
</body>
</html>
